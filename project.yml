name: CosyVoiceMobile
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  CosyVoiceMobile:
    type: application
    platform: iOS
    sources:
      - path: ios/App
      - path: ios/Bridge
      - path: model-manifest.json
    settings:
      base:
        INFOPLIST_FILE: ios/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CosyVoiceMobile
        PRODUCT_NAME: CosyVoiceMobile
        SWIFT_OBJC_BRIDGING_HEADER: ios/Bridge/CosyVoiceMobile-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/MNN.framework/Headers"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - framework: Vendor/MNN.framework
        embed: false
    scheme:
      testTargets: []
