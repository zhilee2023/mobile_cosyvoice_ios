name: Build CosyVoice iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake xcodegen
      - name: Check sentence planning and DSP math
        run: |
          mkdir -p build-tests
          swiftc ios/App/SentencePlanner.swift tests/SentencePlannerChecks.swift -o build-tests/sentence-check
          build-tests/sentence-check
          swiftc ios/App/TestReportArchive.swift tests/TestReportArchiveChecks.swift -o build-tests/report-check
          build-tests/report-check
          swiftc ios/App/ExperimentCatalog.swift tests/ExperimentCatalogChecks.swift -o build-tests/catalog-check
          build-tests/catalog-check
          python3 -m unittest discover -s tests -p test_report_analysis.py
          clang++ -O2 -std=c++17 -Iios/Bridge tests/dsp_check.cpp -o build-tests/dsp-check
          build-tests/dsp-check
          clang++ -O2 -std=c++17 -Iios/Bridge tests/probe_metrics_check.cpp -o build-tests/probe-metrics-check
          build-tests/probe-metrics-check
          clang++ -O2 -std=c++17 -Iios/Bridge tests/budget_check.cpp -o build-tests/budget-check
          build-tests/budget-check
      - name: Build pinned MNN 3.6.1 for iOS
        run: |
          git clone --depth 1 --branch 3.6.1 https://github.com/alibaba/MNN.git MNN
          git -C MNN submodule update --init --recursive --depth 1
          cd MNN
          sh package_scripts/ios/buildiOS.sh \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_BF16=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_BUILD_LLM=ON \
            -DMNN_LLM_BUILD_DEMO=OFF \
            -DLLM_SUPPORT_HTTP_RESOURCE=OFF \
            -DMNN_OPENCL=OFF
      - name: Stage framework
        run: |
          mkdir -p Vendor
          cp -R MNN/MNN-iOS-CPU-GPU/Static/MNN.framework Vendor/
          test -f Vendor/MNN.framework/MNN
          test -f Vendor/MNN.framework/Headers/llm/llm.hpp
          python3 - <<'PY'
          import subprocess
          symbols = subprocess.check_output(['nm', '-g', 'Vendor/MNN.framework/MNN'], text=True)
          assert 'BF16Functions' in symbols, 'BF16 build flag did not produce BF16 runtime symbols'
          print('BF16 runtime symbols present; actual operator/backend use still needs phone validation')
          PY
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project CosyVoiceMobile.xcodeproj \
            -scheme CosyVoiceMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify bundle settings
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('build/Build/Products/Release-iphoneos/CosyVoiceMobile.app')
          with (app / 'Info.plist').open('rb') as source:
              info = plistlib.load(source)
          assert info['UIFileSharingEnabled'] is True
          assert info['LSSupportsOpeningDocumentsInPlace'] is True
          assert (app / 'model-manifest.json').is_file()
          assert not list(app.rglob('*.inc')), 'Bridge includes must not be bundled as resources'
          print('Unsigned app and file sharing verified')
          PY
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CosyVoiceMobile.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload CosyVoiceMobile-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CosyVoiceMobile-unsigned
          path: CosyVoiceMobile-unsigned.ipa
          if-no-files-found: error
