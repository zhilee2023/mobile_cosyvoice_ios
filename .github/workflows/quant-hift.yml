name: Probe CosyVoice HiFT W8 W4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quant-hift.yml'
      - 'scripts/quantize_internal_mnn.py'
      - 'scripts/cloud_hift_quant_eval.py'
      - 'scripts/cloud_component_quant_eval.py'
      - 'scripts/audio_sensitivity_metrics.py'
      - 'scripts/pc_flow_hift_probe.py'
      - 'testdata/pc-real-74-speech-tokens.csv'

permissions:
  contents: read

jobs:
  quant-hift:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned MNN and test dependencies
        run: python -m pip install 'MNN==3.6.1' 'numpy==1.26.4'
      - name: Download and verify published model ZIP
        run: |
          python scripts/download_model.py
          python scripts/extract_model.py downloads/cosyvoice3-mnn-mobile-fp16-complete.zip --accept-known-flow-graph-mismatch
      - name: Convert HiFT core W8 and W4 HQQ
        run: |
          mkdir -p reports/cloud-hift-quant
          python scripts/quantize_internal_mnn.py models/CosyVoice3/hift-core.fp32.mnn quant/cloud-hift-core-w8.mnn --bits 8 --report reports/cloud-hift-quant/convert-w8.json > reports/cloud-hift-quant/convert-w8.log 2>&1
          python scripts/quantize_internal_mnn.py models/CosyVoice3/hift-core.fp32.mnn quant/cloud-hift-core-w4.mnn --bits 4 --report reports/cloud-hift-quant/convert-w4.json > reports/cloud-hift-quant/convert-w4.log 2>&1
      - name: Convert Conditioner and F0 separately
        run: |
          mkdir -p reports/cloud-component-quant
          python scripts/quantize_internal_mnn.py models/CosyVoice3/flow-conditioner.fp32.mnn quant/cloud-conditioner-w8.mnn --bits 8 --report reports/cloud-component-quant/conditioner-w8.json > reports/cloud-component-quant/conditioner-w8.log 2>&1
          python scripts/quantize_internal_mnn.py models/CosyVoice3/flow-conditioner.fp32.mnn quant/cloud-conditioner-w4.mnn --bits 4 --report reports/cloud-component-quant/conditioner-w4.json > reports/cloud-component-quant/conditioner-w4.log 2>&1
          python scripts/quantize_internal_mnn.py models/CosyVoice3/hift-f0.fp32.mnn quant/cloud-f0-w8.mnn --bits 8 --report reports/cloud-component-quant/f0-w8.json > reports/cloud-component-quant/f0-w8.log 2>&1
          python scripts/quantize_internal_mnn.py models/CosyVoice3/hift-f0.fp32.mnn quant/cloud-f0-w4.mnn --bits 4 --report reports/cloud-component-quant/f0-w4.json > reports/cloud-component-quant/f0-w4.log 2>&1
      - name: Compare PCM and WAV against FP32
        run: python scripts/cloud_hift_quant_eval.py
      - name: Compare Conditioner and F0 against FP32
        run: python scripts/cloud_component_quant_eval.py
      - name: Upload metrics and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CosyVoice-HiFT-W8-W4-quant-report
          path: |
            reports/cloud-hift-quant/
            reports/cloud-component-quant/
          if-no-files-found: warn
